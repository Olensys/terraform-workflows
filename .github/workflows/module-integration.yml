name: Module Integration

on:
  workflow_call:
    inputs:
      cloud:
        description: Cloud the module targets (aws or google)
        type: string
        required: true
      engine:
        description: Engine binary to run (terraform or tofu)
        type: string
        required: false
        default: terraform
    secrets:
      AWS_ROLE_ARN:
        required: false
      AWS_REGION:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false

permissions:
  contents: read

concurrency:
  group: integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  integration:
    name: Integration (${{ inputs.cloud }}, ${{ inputs.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate inputs
        env:
          CLOUD: ${{ inputs.cloud }}
          ENGINE: ${{ inputs.engine }}
        run: |
          case "$CLOUD" in aws|google) ;; *) echo "cloud must be aws or google" >&2; exit 1 ;; esac
          case "$ENGINE" in terraform|tofu) ;; *) echo "engine must be terraform or tofu" >&2; exit 1 ;; esac

      - uses: actions/checkout@v4

      - name: Read pinned versions
        id: versions
        run: |
          set -euo pipefail
          echo "terraform=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"
          echo "tofu=$(tr -d '[:space:]' < .opentofu-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        if: inputs.engine == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: inputs.engine == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.versions.outputs.tofu }}
          tofu_wrapper: false

      - name: Configure AWS credentials
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authenticate to Google Cloud
        if: inputs.cloud == 'google'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Init
        run: ${{ inputs.engine }} init -backend=false -input=false

      - name: Integration test
        run: ${{ inputs.engine }} test -filter=tests/complete.tftest.hcl
