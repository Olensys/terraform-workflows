name: Module Integration

on:
  workflow_call:
    inputs:
      cloud:
        description: Cloud the module targets (aws, google or cloudflare)
        type: string
        required: true
      engine:
        description: Engine binary to run (terraform or tofu)
        type: string
        required: false
        default: terraform
    secrets:
      AWS_ROLE_ARN:
        required: false
      AWS_REGION:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  integration:
    name: Integration (${{ inputs.cloud }}, ${{ inputs.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate inputs
        env:
          CLOUD: ${{ inputs.cloud }}
          ENGINE: ${{ inputs.engine }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "$CLOUD" in aws|google|cloudflare) ;; *) echo "cloud must be aws, google or cloudflare" >&2; exit 1 ;; esac
          case "$ENGINE" in terraform|tofu) ;; *) echo "engine must be terraform or tofu" >&2; exit 1 ;; esac
          if [ "$CLOUD" = aws ]; then
            [ -n "$AWS_ROLE_ARN" ] && [ -n "$AWS_REGION" ] || { echo "AWS_ROLE_ARN and AWS_REGION secrets are required for cloud=aws" >&2; exit 1; }
          elif [ "$CLOUD" = google ]; then
            [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$GCP_SERVICE_ACCOUNT" ] || { echo "GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT secrets are required for cloud=google" >&2; exit 1; }
          else
            [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN secret is required for cloud=cloudflare" >&2; exit 1; }
          fi

      - uses: actions/checkout@v4

      - name: Export TF_VAR_* repository variables
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          # GitHub upper-cases variable names (TF_VAR_PROJECT_ID) but Terraform matches TF_VAR_<name> case-sensitively against lowercase variable names, so lowercase the suffix.
          echo "$VARS_JSON" | jq -r 'to_entries[] | select(.key | ascii_upcase | startswith("TF_VAR_")) | "TF_VAR_\(.key[7:] | ascii_downcase)<<TFVAR_EOF\n\(.value)\nTFVAR_EOF"' >> "$GITHUB_ENV"
          echo "exported: $(echo "$VARS_JSON" | jq -r 'keys[] | select(ascii_upcase | startswith("TF_VAR_"))' | tr '\n' ' ')"

      - name: Read pinned versions
        id: versions
        run: |
          set -euo pipefail
          echo "terraform=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"
          echo "tofu=$(tr -d '[:space:]' < .opentofu-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        if: inputs.engine == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: inputs.engine == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.versions.outputs.tofu }}
          tofu_wrapper: false

      - name: Configure AWS credentials
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authenticate to Google Cloud
        if: inputs.cloud == 'google'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ${{ inputs.engine }} init -backend=false -input=false

      - name: Integration test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ${{ inputs.engine }} test -filter=tests/complete.tftest.hcl
